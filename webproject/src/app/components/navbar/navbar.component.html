<nav class="navbar">
  <div class="brand">
    <a routerLink="/home">University Portal</a>
  </div>

  <div class="nav-links">
    <a
      *ngFor="let item of navItems"
      routerLink="{{ item.path }}"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      {{ item.label }}
    </a>
  </div>

  <div class="auth-info">
    <ng-container *ngIf="currentUser; else guestLinks">
      <span class="welcome">Hi, {{ currentUser?.name }}</span>
      <button class="logout-btn" (click)="logout()">Logout</button>
    </ng-container>
    <ng-template #guestLinks>
      <a routerLink="/login" class="login-link">Login</a>
    </ng-template>
  </div>
</nav>
